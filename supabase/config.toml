# ============================================================================
# Supabase CLI configuration for the JJ Media ERP project.
# `supabase link --project-ref zfrgzunauxozqgdjghso` then `supabase db push`.
# The CLI may adjust this file when a newer version is used.
# ============================================================================
project_id = "jj-media-erp"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_signup = false

# ERP accounts are provisioned by an administrator, never by self-registration.
[auth.email]
enable_signup = false
enable_confirmations = false

[auth.sms]
enable_signup = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
